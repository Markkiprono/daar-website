# Daar — production stack for a single VPS.
#
#   app      Next.js standalone server
#   db       PostgreSQL 17
#   caddy    reverse proxy, automatic HTTPS for both hostnames
#
# Only Caddy is exposed to the internet. Postgres has no published port —
# it is reachable only from the app over the internal network.

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-daar}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Nightly dumps land here; see DEPLOY.md for the cron entry.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daar} -d ${POSTGRES_DB:-daar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs pending migrations, then exits. The app waits for it to succeed.
  #
  # Separate from the app because the runtime image is deliberately slim and
  # has no Prisma CLI — this uses the build stage, which already carries the
  # full dependency tree. It shares every layer with the app build, so it
  # costs no extra download.
  #
  # `migrate deploy` only applies migrations that already exist. It never
  # prompts, never generates, and never drops data.
  migrate:
    build:
      context: .
      target: build
      # Same args as app so both share one cached build of this stage —
      # differing args would fork the cache and build everything twice.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-KES}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-daar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-daar}?schema=public
    command: npx prisma migrate deploy

  app:
    build:
      context: .
      # Build-time copies of the NEXT_PUBLIC_ values: the bundler inlines
      # them, so handing them only to the running container is too late.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-KES}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-daar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-daar}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
      ADMIN_HOST: ${ADMIN_HOST:?}
      AUTH_SECRET: ${AUTH_SECRET:?generate one, see DEPLOY.md}
      NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-KES}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOADS_DIR: /data/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
    volumes:
      # Uploaded photos must outlive the container.
      - uploads:/data/uploads
      # So must the optimized copies of them. Without this the image cache is
      # thrown away on every redeploy, and the first visitor after each deploy
      # pays to re-encode the whole menu on two cores.
      - next-cache:/app/.next/cache
    command: node server.js

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  next-cache:
  caddy-data:
  caddy-config:
