# Daar — production stack for a single VPS.
#
#   app      Next.js standalone server
#   db       PostgreSQL 17
#   caddy    reverse proxy, automatic HTTPS for both hostnames
#
# Only Caddy is exposed to the internet. Postgres has no published port —
# it is reachable only from the app over the internal network.

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-daar}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Nightly dumps land here; see DEPLOY.md for the cron entry.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daar} -d ${POSTGRES_DB:-daar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-daar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-daar}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
      ADMIN_HOST: ${ADMIN_HOST:?}
      AUTH_SECRET: ${AUTH_SECRET:?generate one, see DEPLOY.md}
      NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-KES}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOADS_DIR: /data/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
    volumes:
      # Uploaded photos must outlive the container.
      - uploads:/data/uploads
    # Apply migrations before serving. `migrate deploy` only runs already-
    # generated migrations — it never prompts and never drops data.
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
